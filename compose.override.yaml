# dev-only overrides (auto-merged by `docker compose`).
# exposes every service's port on the host so you can poke at them
# directly with psql / redis-cli / curl. prod compose does NOT do this.
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
  api:
    ports:
      - "${API_PORT:-4000}:4000"
  web:
    ports:
      - "${WEB_PORT:-8080}:80"
