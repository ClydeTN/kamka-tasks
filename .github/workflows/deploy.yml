name: deploy

# triggered by push to main (any change). also manual via workflow_dispatch.
# the changes detection step decides whether to actually rebuild each
# service or just retag the existing image at the new SHA.
on:
  push:
    branches: [main]
    # only deploy when something the VM actually runs has changed.
    # docs, the dev compose files, the local .env.example, etc. never
    # trigger a release. `workflow_dispatch` below stays open for the
    # emergency button.
    paths:
      - 'api/**'
      - 'worker/**'
      - 'web/**'
      - 'deploy/**'
      - 'compose.prod.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write     # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  # opt every JS-based action into Node 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # which services actually changed since the previous commit?
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:    ${{ steps.f.outputs.api }}
      worker: ${{ steps.f.outputs.worker }}
      web:    ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: dorny/paths-filter@v3
        id: f
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'api/**'
            worker:
              - 'worker/**'
            web:
              - 'web/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    env:
      IMAGE_OWNER: clydetn
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            changed: ${{ needs.changes.outputs.api }}
          - service: worker
            changed: ${{ needs.changes.outputs.worker }}
          - service: web
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # if the service's source didn't change, skip the build entirely --
      # just retag the existing :latest as :<sha>. ~1s registry-side op,
      # vs a 30-60s rebuild.
      - name: check for existing :latest (when source unchanged)
        id: existing
        if: matrix.changed != 'true'
        run: |
          if docker buildx imagetools inspect \
              ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tasks-${{ matrix.service }}:latest >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: retag (no source change)
        if: matrix.changed != 'true' && steps.existing.outputs.exists == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tasks-${{ matrix.service }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tasks-${{ matrix.service }}:latest

      - name: build + push
        if: matrix.changed == 'true' || steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tasks-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tasks-${{ matrix.service }}:latest
          # the source label links the package to this repo so it inherits
          # public visibility instead of defaulting to private
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_OWNER: clydetn
    steps:
      - uses: actions/checkout@v4

      # OIDC -> tf-runner SA. only used here to look up the VM's external IP.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/685230180124/locations/global/workloadIdentityPools/gh-actions-tasks/providers/github
          service_account: tasks-tf-runner@formulai.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      - name: read VM IP from GCE
        id: vm
        run: |
          IP=$(gcloud compute addresses describe tasks-vm-ip \
                --region=europe-west1 \
                --project=formulai \
                --format='value(address)')
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: install deploy ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # wait briefly for the VM to be ssh-ready (first boot can be slow
          # if it's a brand new instance running cloud-init)
          for i in $(seq 1 30); do
            if ssh-keyscan -T 5 -H ${{ steps.vm.outputs.ip }} >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 4
          done

      - name: copy deploy artifacts onto the VM
        run: |
          SCP="scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          $SCP compose.prod.yaml deploy/Caddyfile deploy/deploy.sh deploy/rollback.sh \
            deploy@${{ steps.vm.outputs.ip }}:/opt/tasks/
          ssh -i ~/.ssh/id_deploy deploy@${{ steps.vm.outputs.ip }} \
            'chmod +x /opt/tasks/deploy.sh /opt/tasks/rollback.sh'

      - name: read DOMAIN from VM /opt/tasks/.env
        id: domain
        run: |
          # terraform wrote DOMAIN into /opt/tasks/.env on first boot. fall back
          # to the nip.io form if for some reason it's missing.
          D=$(ssh -i ~/.ssh/id_deploy deploy@${{ steps.vm.outputs.ip }} \
                'grep ^DOMAIN= /opt/tasks/.env | cut -d= -f2' \
              || echo "${{ steps.vm.outputs.ip }}.nip.io")
          echo "value=$D" >> $GITHUB_OUTPUT
          echo "deploying to https://$D"

      - name: run deploy on the VM
        run: |
          ssh -i ~/.ssh/id_deploy deploy@${{ steps.vm.outputs.ip }} \
            "TAG='${{ github.sha }}' \
             IMAGE_OWNER='${{ env.IMAGE_OWNER }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             /opt/tasks/deploy.sh"

      - name: smoke test
        run: |
          # caddy needs ~30s for first cert; subsequent deploys hit the
          # green path immediately. allow generous retry on first deploy.
          for i in $(seq 1 36); do
            code=$(curl -sko /dev/null -w '%{http_code}' \
                    "https://${{ steps.domain.outputs.value }}/api/tasks" || echo 000)
            if [ "$code" = "200" ]; then
              echo "smoke test OK ($code) at https://${{ steps.domain.outputs.value }}"
              exit 0
            fi
            echo "attempt $i: http $code, retrying"
            sleep 5
          done
          echo "smoke test failed"
          exit 1

      - name: summary
        if: always()
        run: |
          {
            echo "## deploy summary"
            echo "- tag: \`${{ github.sha }}\`"
            echo "- url: https://${{ steps.domain.outputs.value }}"
            echo "- vm:  ${{ steps.vm.outputs.ip }}"
          } >> $GITHUB_STEP_SUMMARY
