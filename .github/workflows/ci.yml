name: ci

on:
  pull_request:
  push:
    branches: [main, develop]   # PRs always run CI; pushes to main/develop too.
                                # deploy.yml only fires on main, so develop is
                                # validated but never auto-deployed.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # detect which top-level directories changed so downstream jobs can skip
  # work that isn't relevant. on push to main we always look at the diff vs
  # the previous commit; on PRs we compare against the base branch.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:    ${{ steps.f.outputs.api }}
      worker: ${{ steps.f.outputs.worker }}
      web:    ${{ steps.f.outputs.web }}
      infra:  ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            api:
              - 'api/**'
            worker:
              - 'worker/**'
            web:
              - 'web/**'
            infra:
              - 'infra/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: worker }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: syntax check
        run: node --check src/index.js

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
