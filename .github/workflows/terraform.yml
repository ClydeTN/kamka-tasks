name: terraform

# manual-only apply. PRs that touch infra/ get an auto plan with the diff
# in the job output. nothing about prod infra changes without an explicit
# workflow_dispatch from a human.
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'plan, apply, or destroy'
        required: true
        type: choice
        default: 'plan'
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write     # required for the GCP OIDC token exchange (WIF)
  pull-requests: write

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  # opt every JS-based action into Node 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v4

      - name: authenticate to GCP via OIDC (no key files)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/685230180124/locations/global/workloadIdentityPools/gh-actions-tasks/providers/github
          service_account: tasks-tf-runner@formulai.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate

      - name: plan
        if: github.event_name == 'pull_request' || inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -input=false -out=tfplan -no-color

      - name: apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve

      - name: outputs
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform output -no-color
